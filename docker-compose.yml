# Real multi-vulnerability target for testing Chimera.
# Run:  docker compose up -d   (needs a working Docker daemon)
# Then scan:  http://127.0.0.1:3000
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Alternative: DVWA (PHP + MySQL) across multiple ports if you prefer classic vulns.
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8081:80"
    restart: unless-stopped
